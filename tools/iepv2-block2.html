<!-- ===== IEP V2 STYLES ===== -->
<style>
.v2-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}
.v2-stat{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px;text-align:center;box-shadow:var(--shadow)}
.v2-stat-num{font-size:30px;font-weight:800;color:var(--text-primary);line-height:1.1}
.v2-stat-lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.06em;margin-top:6px}
.v2-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;margin-top:8px}
.v2-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s;display:flex;flex-direction:column;gap:10px}
.v2-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,0.1)}
.v2-card-top{display:flex;align-items:center;justify-content:space-between}
.v2-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;color:white}
.v2-eid{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:0.05em}
.v2-card h4{font-size:18px;color:var(--text-primary);margin:2px 0}
.v2-meta{font-size:12px;color:var(--text-muted)}
.v2-status{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:3px 8px;border-radius:4px}
.v2-status.done{background:rgba(66,184,180,0.12);color:#1F7A77}
.v2-status.live{background:rgba(232,115,74,0.12);color:#B85042}
.v2-status.paused{background:rgba(122,142,160,0.14);color:#5a6b7d}
.v2-winner{font-size:12.5px;color:var(--text-secondary);background:var(--bg-main);border-left:3px solid #2C8C89;border-radius:6px;padding:10px 12px;line-height:1.45}
.v2-winner b{color:var(--text-primary)}
.v2-detail{display:none}
.v2-detail.open{display:block;animation:fadeIn .3s ease-in}
.v2-back{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;margin-bottom:18px}
.v2-back:hover{background:var(--bg-card-hover)}
.v2-dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.v2-headline{font-size:30px;color:var(--text-primary);line-height:1.2;margin:10px 0 4px;max-width:820px}
.v2-subline{font-size:15px;color:var(--text-muted);max-width:760px;margin-bottom:10px}
.v2-story{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin:18px 0}
.v2-story-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.v2-story-box h5{font-size:11px;text-transform:uppercase;letter-spacing:0.07em;color:#2C8C89;margin-bottom:8px}
.v2-story-box p{font-size:13px;color:var(--text-secondary);line-height:1.6}
.v2-meth{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 4px}
.v2-meth div{background:var(--bg-main);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--text-secondary)}
.v2-meth b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);margin-bottom:2px}
.v2-aud{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:10px 0 4px}
.v2-aud-box{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.v2-aud-box h6{font-size:13px;color:var(--text-primary);margin-bottom:2px}
.v2-aud-size{font-size:11px;font-weight:700;color:#2C8C89;margin-bottom:6px}
.v2-aud-box p{font-size:11.5px;color:var(--text-muted);line-height:1.5}
.v2-round{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin:18px 0;box-shadow:var(--shadow)}
.v2-round-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.v2-round-head h4{font-size:16px;color:var(--text-primary)}
.v2-round-dates{font-size:12px;color:var(--text-muted)}
.v2-crit{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.v2-chart-title{font-size:14px;font-weight:700;color:var(--text-primary);margin:24px 0 2px}
.v2-chart-sub{font-size:11.5px;color:var(--text-muted);margin-bottom:10px}
.v2-insight{background:rgba(107,138,242,0.06);border:1px solid rgba(107,138,242,0.18);border-left:3px solid #6B8AF2;border-radius:8px;padding:12px 15px;font-size:13px;color:var(--text-secondary);line-height:1.6;margin:10px 0 4px}
.v2-insight b{color:#4a68c4}
.v2-narr{background:var(--bg-main);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0}
.v2-narr h6{font-size:13px;color:var(--text-primary);margin-bottom:6px}
.v2-narr p{font-size:13px;color:var(--text-secondary);line-height:1.6}
.v2-outcome{background:rgba(66,184,180,0.06);border:1px solid rgba(66,184,180,0.18);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--text-secondary);line-height:1.55;margin-top:16px}
.v2-outcome b{color:#1F7A77}
.v2-final{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin:18px 0}
.v2-final-box{border-radius:var(--radius);padding:20px 22px;border:1px solid var(--border);background:var(--bg-card);box-shadow:var(--shadow)}
.v2-final-box.reco{border-top:3px solid #2C8C89}
.v2-final-box.learn{border-top:3px solid #6B8AF2}
.v2-final-box h5{font-size:14px;color:var(--text-primary);margin-bottom:10px}
.v2-final-box ol{padding-left:20px;display:flex;flex-direction:column;gap:9px}
.v2-final-box li{font-size:13px;color:var(--text-secondary);line-height:1.55}
.v2-tip{position:fixed;pointer-events:none;background:#0d1a2b;color:#fff;font-size:12px;line-height:1.5;padding:9px 12px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.25);z-index:2000;max-width:280px;display:none}
.v2-legend{display:flex;gap:16px;align-items:center;font-size:11.5px;color:var(--text-muted);margin-top:8px;flex-wrap:wrap}
.v2-legend span{display:inline-flex;align-items:center;gap:6px}
.v2-sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.v2-land-thumb{width:100%;height:170px;object-fit:contain;background:var(--bg-main);border-radius:8px}
.v2-modal{display:none;position:fixed;inset:0;background:rgba(13,26,43,0.72);z-index:3000;align-items:center;justify-content:center;padding:24px}
.v2-modal.open{display:flex}
.v2-modal-box{background:white;border-radius:12px;width:min(480px,94vw);height:min(860px,92vh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,0.4)}
.v2-modal-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text-secondary)}
.v2-modal-bar a{color:var(--accent);text-decoration:none;font-weight:600}
.v2-modal-bar button{background:transparent;border:none;font-size:20px;cursor:pointer;color:var(--text-muted);line-height:1}
.v2-modal iframe{border:none;width:100%;flex:1}
@media (max-width:800px){.v2-stats{grid-template-columns:repeat(2,1fr)}.v2-headline{font-size:24px}}
</style>

<!-- ===== IEP V2 SCRIPT ===== -->
<script>
var IEPV2_BRAND_COLORS = {"Just For Men":"#4A90D9","Vagisil":"#B06AB3","Astroglide":"#E8734A"};
var IEPV2_DATA = /*__IEPV2_DATA__*/[];
var IEPV2_LANDINGS = [
  {exp:"Vagisil|E02", brand:"Vagisil", name:"Vagisil Sensitive — Daily Intimate Wash", note:"Concept: Sensitive Daily Intimate Wash. Platform template with add-to-cart tracking and thank-you page.", url:"/landings/vagisil/sensitive/", thumb:"/landings/vagisil/sensitive/img/product.png"}
];

function v2Fmt(n){return n==null?"—":n.toLocaleString("en-US");}
function v2Esc(s){return s==null?"":String(s);}

function v2RenderStats(){
  var exps=IEPV2_DATA.length, rounds=0, claims=0, done=0;
  IEPV2_DATA.forEach(function(e){rounds+=e.rounds.length; if(e.status==="completed")done++; claims+=(e.claims_count||0);});
  document.getElementById("v2Stats").innerHTML=[[exps,"Experiments"],[rounds,"Rounds run"],[claims,"Claims tested"],[done,"Completed"]]
    .map(function(s){return '<div class="v2-stat"><div class="v2-stat-num">'+s[0]+'</div><div class="v2-stat-lbl">'+s[1]+'</div></div>';}).join("");
}

function v2StatusBadge(st){
  return st==="completed"?'<span class="v2-status done">Completed</span>':(st==="paused"?'<span class="v2-status paused">Paused</span>':'<span class="v2-status live">In field</span>');
}

function v2RenderGrid(){
  document.getElementById("iepV2Grid").innerHTML=IEPV2_DATA.map(function(e,i){
    var c=IEPV2_BRAND_COLORS[e.brand]||"#42b8b4";
    var winner=e.card_winner;
    if(winner&&winner.length>110)winner=winner.slice(0,108)+"…";
    var win=winner?'<div class="v2-winner">Top claim: <b>&ldquo;'+winner+'&rdquo;</b></div>'
                  :'<div class="v2-winner">Currently testing '+(e.claims_count||"several")+' concepts &mdash; results coming soon.</div>';
    var lastRound=e.rounds[e.rounds.length-1];
    return '<div class="v2-card" onclick="v2Open('+i+')">'+
      '<div class="v2-card-top"><span class="v2-chip" style="background:'+c+'">'+e.brand+'</span><span class="v2-eid">'+e.experiment_id+'</span></div>'+
      '<h4>'+e.name+'</h4>'+
      '<div class="v2-meta">'+e.rounds.length+' round'+(e.rounds.length>1?"s":"")+' &middot; '+v2Esc(lastRound.dates)+'</div>'+
      '<div>'+v2StatusBadge(e.status)+'</div>'+win+'</div>';
  }).join("");
}

function v2Open(i){
  var e=IEPV2_DATA[i], c=IEPV2_BRAND_COLORS[e.brand]||"#42b8b4";
  document.getElementById("iepV2Home").style.display="none";
  var d=document.getElementById("iepV2Detail");
  d.classList.add("open");
  var h='<button class="v2-back" onclick="v2Close()">&larr; All experiments</button>';
  h+='<div class="v2-dhead"><span class="v2-chip" style="background:'+c+'">'+e.brand+'</span><span class="v2-eid">'+e.experiment_id+' &middot; '+e.name+'</span>'+v2StatusBadge(e.status)+'</div>';
  h+='<h3 class="v2-headline">'+v2Esc(e.headline||e.name)+'</h3>';
  if(e.subtitle) h+='<div class="v2-subline">'+e.subtitle+'</div>';

  var story="";
  if(e.background) story+='<div class="v2-story-box"><h5>Background</h5><p>'+e.background+'</p></div>';
  if(e.objective) story+='<div class="v2-story-box"><h5>Learning objective</h5><p>'+e.objective+'</p></div>';
  if(e.hypothesis) story+='<div class="v2-story-box"><h5>Hypothesis</h5><p>'+e.hypothesis+'</p></div>';
  if(story) h+='<div class="v2-story">'+story+'</div>';

  var m=e.methodology||{};
  var meth="";
  [["Platform",m.platform],["Format",m.format],["Field",m.field],["Primary KPI",m.kpi||e.success_criteria]].forEach(function(x){
    if(x[1]) meth+='<div><b>'+x[0]+'</b>'+x[1]+'</div>';
  });
  (m.benchmarks||[]).forEach(function(b){
    meth+='<div><b>Benchmark '+(b.metric==="stopping"?"Stopping":"Closing")+' Power</b>'+b.lo+'% &ndash; '+b.hi+'%</div>';
  });
  if(meth) h+='<div class="v2-meth">'+meth+'</div>';

  if(e.audiences&&e.audiences.length){
    h+='<div class="v2-chart-title" style="margin-top:20px">Audiences &middot; Meta</div><div class="v2-aud">'+e.audiences.map(function(a){
      return '<div class="v2-aud-box"><h6>'+a.name+'</h6>'+(a.size_mm?'<div class="v2-aud-size">'+a.size_mm+' MM estimated</div>':'')+(a.details?'<p>'+a.details+'</p>':'')+'</div>';
    }).join("")+'</div>';
  }

  h+=e.rounds.map(function(r,ri){return v2Round(e,r,ri);}).join("");

  var fin="";
  if(e.learnings&&e.learnings.length) fin+='<div class="v2-final-box learn"><h5>Key learnings</h5><ol>'+e.learnings.map(function(l){return '<li>'+l+'</li>';}).join("")+'</ol></div>';
  if(e.recommendations&&e.recommendations.length) fin+='<div class="v2-final-box reco"><h5>Recommendations</h5><ol>'+e.recommendations.map(function(l){return '<li>'+l+'</li>';}).join("")+'</ol></div>';
  if(fin) h+='<div class="v2-final">'+fin+'</div>';

  var lands=IEPV2_LANDINGS.map(function(l,li){return {l:l,li:li};}).filter(function(x){return x.l.exp===e.brand+"|"+e.experiment_id;});
  if(lands.length){
    h+='<div class="v2-round"><div class="v2-round-head"><h4>Landing Pages</h4><span class="v2-round-dates">'+lands.length+' template'+(lands.length>1?"s":"")+' in the platform</span></div>'+
      '<div class="v2-crit">Versioned in the platform, generated from a shared template with add-to-cart tracking. Click to preview.</div>'+
      '<div class="v2-grid">'+lands.map(function(x){
        return '<div class="v2-card" onclick="v2Landing('+x.li+')">'+
          '<img class="v2-land-thumb" src="'+x.l.thumb+'" alt="" loading="lazy">'+
          '<h4 style="font-size:15px">'+x.l.name+'</h4><div class="v2-meta">'+x.l.note+'</div></div>';
      }).join("")+'</div></div>';
  }

  d.innerHTML=h;
  e.rounds.forEach(function(r,ri){
    (r.charts||[]).forEach(function(ch,ci){
      var rows=(ch.rows||[]).filter(function(x){return x.value!=null;});
      if(!rows.length) return;
      v2Bar("v2c-"+i+"-"+ri+"-"+ci, rows.map(function(x){
        var tip="<b>"+x.label+"</b>"+(x.group?"<br><i>"+x.group+"</i>":"")+(x.extra?"<br>"+x.extra:"")+
          "<br>"+(ch.metric==="closing"?"Closing":"Stopping")+" Power: "+x.value.toFixed(2)+"%"+
          (x.better_than?"<br>Statistically above: "+x.better_than:"");
        return {label:x.label,value:x.value,winner:!!x.winner,tip:tip};
      }), ch.benchmark);
    });
  });
  window.scrollTo({top:0,behavior:"smooth"});
}
function v2Close(){
  document.getElementById("iepV2Detail").classList.remove("open");
  document.getElementById("iepV2Home").style.display="block";
}

function v2Round(e,r,ri){
  var idx=IEPV2_DATA.indexOf(e);
  var h='<div class="v2-round"><div class="v2-round-head"><h4>Round '+(r.round||ri+1)+'</h4><span class="v2-round-dates">'+v2Esc(r.dates)+'</span></div>';
  if(e.success_criteria) h+='<div class="v2-crit">Success criteria: '+e.success_criteria+'</div>';
  (r.charts||[]).forEach(function(ch,ci){
    var rows=ch.rows||[];
    var numeric=rows.some(function(x){return x.value!=null;});
    h+='<div class="v2-chart-title">'+ch.title+'</div>';
    var explain=(ch.metric==="closing"?"Add to cart / landing page visits":"Unique link clicks / reach")+(ch.audience?" &middot; "+ch.audience:"")+(ch.benchmark?" &middot; Shaded band = benchmark":"")+" &middot; Hover for detail";
    if(numeric){
      h+='<div class="v2-chart-sub">'+explain+'</div><div id="v2c-'+idx+'-'+ri+'-'+ci+'"></div>';
    }else{
      h+='<ul style="font-size:13px;color:var(--text-secondary);line-height:1.9;padding-left:20px">'+rows.map(function(x){return '<li>'+(x.group?'<b>'+x.group+':</b> ':'')+x.label+'</li>';}).join("")+'</ul>';
    }
    if(ch.insight) h+='<div class="v2-insight"><b>Read:</b> '+ch.insight+'</div>';
  });
  (r.narrative||[]).forEach(function(n){
    h+='<div class="v2-narr"><h6>'+n.title+'</h6><p>'+n.body+'</p></div>';
  });
  if(r.outcome) h+='<div class="v2-outcome"><b>Outcome.</b> '+r.outcome+'</div>';
  h+='</div>';
  return h;
}

function v2Bar(elId,rows,bm){
  var el=document.getElementById(elId); if(!el) return;
  var W=860, rowH=rows.length>15?26:34, padL=310, padR=90, padT=8, padB=26;
  var H=padT+rows.length*rowH+padB;
  var maxV=Math.max.apply(null,rows.map(function(r){return r.value;}).concat(bm?[bm.hi]:[]))*1.15;
  function x(v){return padL+(W-padL-padR)*(v/maxV);}
  var s='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;font-family:inherit" role="img">';
  if(bm) s+='<rect x="'+x(bm.lo)+'" y="'+padT+'" width="'+(x(bm.hi)-x(bm.lo))+'" height="'+(rows.length*rowH)+'" fill="#7a8ea0" opacity="0.13"/>';
  var step=maxV>12?5:(maxV>6?2:1);
  for(var t=step;t<maxV;t+=step){
    s+='<line x1="'+x(t)+'" y1="'+padT+'" x2="'+x(t)+'" y2="'+(padT+rows.length*rowH)+'" stroke="#e2e8f0" stroke-width="1"/>';
    s+='<text x="'+x(t)+'" y="'+(padT+rows.length*rowH+16)+'" font-size="10.5" fill="#7a8ea0" text-anchor="middle">'+t+'%</text>';
  }
  rows.forEach(function(r,i){
    var y=padT+i*rowH, bh=rowH-10;
    var lbl=r.label.length>52?r.label.slice(0,50)+"…":r.label;
    s+='<g class="v2b" data-tip="'+r.tip.replace(/"/g,"&quot;")+'">';
    s+='<rect x="0" y="'+y+'" width="'+W+'" height="'+rowH+'" fill="transparent"/>';
    s+='<text x="'+(padL-10)+'" y="'+(y+rowH/2+3.5)+'" font-size="12" fill="#4a5568" text-anchor="end">'+lbl+'</text>';
    s+='<rect x="'+padL+'" y="'+(y+5)+'" width="'+Math.max(2,x(r.value)-padL)+'" height="'+bh+'" rx="4" fill="#2C8C89"/>';
    s+='<text x="'+(x(r.value)+8)+'" y="'+(y+rowH/2+3.5)+'" font-size="12" font-weight="700" fill="#1a2332">'+r.value.toFixed(2)+'%'+(r.winner?'  ★':'')+'</text>';
    s+='</g>';
  });
  s+='</svg>';
  if(bm) s+='<div class="v2-legend"><span><span class="v2-sw" style="background:#2C8C89"></span>Tested</span><span><span class="v2-sw" style="background:#7a8ea0;opacity:0.25"></span>Benchmark '+bm.lo+'%&ndash;'+bm.hi+'%</span><span>★ Top performer</span></div>';
  el.innerHTML=s;
  el.querySelectorAll(".v2b").forEach(function(g){
    g.addEventListener("mousemove",function(ev){
      var tip=document.getElementById("v2Tip");
      tip.innerHTML=g.getAttribute("data-tip"); tip.style.display="block";
      tip.style.left=Math.min(ev.clientX+14,window.innerWidth-300)+"px"; tip.style.top=(ev.clientY+14)+"px";
    });
    g.addEventListener("mouseleave",function(){document.getElementById("v2Tip").style.display="none";});
  });
}

function v2Landing(i){
  var l=IEPV2_LANDINGS[i];
  document.getElementById("v2LandFrame").src=l.url;
  document.getElementById("v2LandOpen").href=l.url;
  document.getElementById("v2LandTitle").textContent=l.name;
  document.getElementById("v2LandModal").classList.add("open");
}
function v2LandClose(){
  document.getElementById("v2LandModal").classList.remove("open");
  document.getElementById("v2LandFrame").src="about:blank";
}

(function v2Init(){
  function go(){ if(document.getElementById("iepV2Grid")&&IEPV2_DATA.length){v2RenderStats();v2RenderGrid();} }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",go); else go();
})();
</script>
<div class="v2-tip" id="v2Tip"></div>
<div class="v2-modal" id="v2LandModal" onclick="if(event.target===this)v2LandClose()">
  <div class="v2-modal-box">
    <div class="v2-modal-bar"><span id="v2LandTitle"></span><span><a id="v2LandOpen" href="#" target="_blank" rel="noopener">Open full page &#8599;</a> &nbsp; <button onclick="v2LandClose()" aria-label="Close">&times;</button></span></div>
    <iframe id="v2LandFrame" src="about:blank" title="Landing preview"></iframe>
  </div>
</div>
