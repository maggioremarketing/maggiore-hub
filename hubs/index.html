<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consumer Insights Hubs · Maggiore</title>
<style>
@font-face{font-family:"Switzer";font-weight:100 900;font-style:normal;font-display:swap;src:url("/combe/fonts/Switzer-100.ttf") format("truetype")}
:root{--noche:#111118;--fg:#fcfcfc;--fg2:#c9c9d0;--line:#2a2a30;--turquesa:#2cced6}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noche);color:var(--fg);font-family:"Switzer",system-ui,sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;padding:32px}
img.logo{height:26px}
h1{font-weight:400;font-size:28px;letter-spacing:-.012em}
p.sub{color:var(--fg2);font-size:14px;margin-top:8px;text-align:center}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
a.card{display:block;width:280px;padding:28px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--fg);background:#1b1b21;transition:border-color .15s ease,transform .15s ease}
a.card:hover{border-color:var(--turquesa);transform:translateY(-2px)}
a.card h2{font-size:20px;font-weight:500;margin-bottom:6px}
a.card span{font-size:12px;color:var(--fg2)}
</style>
</head>
<body>
<img class="logo" src="/marca/assets/logo/Logo%20Maggiore%20Marketing/SVG/Logo%20Maggiore%20Marketing%20sin%20reticula%20blanco.svg" alt="Maggiore">
<div style="text-align:center"><h1>Consumer Insights Hubs</h1><p class="sub">Choose a client hub to continue.</p></div>

</div>
</body>
</html>
